name: MetaTrader 5 Runner

on:
  workflow_dispatch:

jobs:
  mt5:
    runs-on: ubuntu-latest

    steps:
      - name: Install MetaTrader 5
        shell: bash
        run: |
          #!/bin/bash
          set -e

          # Copyright 2000-2026, MetaQuotes Ltd.

          # MetaTrader and WebView2 download urls
          URL_MT5="https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          URL_WEBVIEW="https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/f2910a1e-e5a6-4f17-b52d-7faf525d17f8/MicrosoftEdgeWebview2Setup.exe"

          # Wine version
          WINE_VERSION="staging"

          export DEBIAN_FRONTEND=noninteractive

          . /etc/os-release

          echo "OS: $NAME $VERSION_ID"

          echo "Update system..."
          sudo apt update
          sudo apt upgrade -y

          echo "Install dependencies..."
          sudo apt install -y \
            bc \
            wget \
            curl \
            gnupg \
            ca-certificates

          echo "Enable 32-bit architecture..."
          sudo dpkg --add-architecture i386

          echo "Create Wine keyring..."
          sudo mkdir -pm755 /etc/apt/keyrings

          sudo wget -O - \
            https://dl.winehq.org/wine-builds/winehq.key \
            | sudo gpg --dearmor \
            -o /etc/apt/keyrings/winehq-archive.key

          echo "Detect Ubuntu version..."

          VERSION_FULL=$(echo "$VERSION_ID * 100" | bc -l | cut -d "." -f1)

          echo "VERSION_FULL=$VERSION_FULL"

          echo "Install WineHQ repository..."

          sudo rm -f /etc/apt/sources.list.d/winehq*

          if (( VERSION_FULL >= 2510 )); then

              sudo wget -NP /etc/apt/sources.list.d/ \
                https://dl.winehq.org/wine-builds/ubuntu/dists/questing/winehq-questing.sources

          elif (( VERSION_FULL >= 2504 )); then

              sudo wget -NP /etc/apt/sources.list.d/ \
                https://dl.winehq.org/wine-builds/ubuntu/dists/plucky/winehq-plucky.sources

          elif (( VERSION_FULL >= 2400 )); then

              sudo wget -NP /etc/apt/sources.list.d/ \
                https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources

          elif (( VERSION_FULL >= 2300 )); then

              sudo wget -NP /etc/apt/sources.list.d/ \
                https://dl.winehq.org/wine-builds/ubuntu/dists/lunar/winehq-lunar.sources

          elif (( VERSION_FULL >= 2210 )); then

              sudo wget -NP /etc/apt/sources.list.d/ \
                https://dl.winehq.org/wine-builds/ubuntu/dists/kinetic/winehq-kinetic.sources

          elif (( VERSION_FULL >= 2100 )); then

              sudo wget -NP /etc/apt/sources.list.d/ \
                https://dl.winehq.org/wine-builds/ubuntu/dists/jammy/winehq-jammy.sources

          elif (( VERSION_FULL >= 2000 )); then

              sudo wget -NP /etc/apt/sources.list.d/ \
                https://dl.winehq.org/wine-builds/ubuntu/dists/focal/winehq-focal.sources

          else

              sudo wget -NP /etc/apt/sources.list.d/ \
                https://dl.winehq.org/wine-builds/ubuntu/dists/bionic/winehq-bionic.sources

          fi

          echo "Update repositories..."
          sudo apt update

          echo "Install Wine $WINE_VERSION..."

          sudo apt install --install-recommends \
            winehq-$WINE_VERSION \
            -y

          echo "Wine version:"
          wine --version

          echo "Download MetaTrader and WebView2 Runtime..."

          curl -fL "$URL_MT5" \
            --output mt5setup.exe

          curl -fL "$URL_WEBVIEW" \
            --output webview2.exe

          echo "Files downloaded:"
          ls -lh mt5setup.exe webview2.exe

          echo "Set environment to Windows 11..."

          export WINEPREFIX="$HOME/.mt5"

          winecfg -v=win11

          echo "Install WebView2 Runtime..."

          wine webview2.exe /silent /install

          echo "Install MetaTrader 5..."

          wine mt5setup.exe

          echo "MetaTrader installation completed."

          echo "Wine prefix:"
          ls -lah "$WINEPREFIX"

          echo "Installed Windows programs:"
          find "$WINEPREFIX/drive_c/Program Files" \
            -maxdepth 3 \
            -type f \
            2>/dev/null | head -100
