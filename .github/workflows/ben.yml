name: MT5 Headless

on:
  workflow_dispatch:

jobs:
  mt5:
    runs-on: windows-latest

    steps:
      - name: Download
        shell: cmd
        run: |
          curl -fL "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -o mt5setup.exe
          if not exist mt5setup.exe exit /b 1
          for %%A in (mt5setup.exe) do if %%~zA==0 exit /b 1
          echo Downloaded mt5setup.exe

      - name: Install
        shell: cmd
        run: |
          mt5setup.exe /auto /path:"C:\MT5"
          if errorlevel 1 exit /b 1

      - name: Run
        shell: powershell
        run: |
          $exe = Get-ChildItem C:\MT5 -Filter terminal64.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$exe) { exit 1 }
          & $exe.FullName /portable /config:"$env:GITHUB_WORKSPACE\mt5.ini"
